<!DOCTYPE html>
<html>
    <head>
        <title>veg Menu</title>
    <style>
        body {
            font-family: 'Comic Sans MS',cursive;
            background-color: #f5f1e6;
            margin: 0;
            padding: 30px;
            text-align: center;
        }
        h1{
            color:#529e56;
            font-size: 42px;
            margin-bottom: 35px;
        }    
        .menu-container{
            display:grid;
            grid-template-columns: repeat(6,1fr);
            gap:25px;
            max-width: 1400px;
            margin: auto;
        }
        .food-card {
            background-color: white;
            padding: 15px;
            box-shadow:0 5px 12px gray;
            border-radius: 15px;
            transition: 0.3s;
        }
        .food-card:hover {
            transform: translateY(-8px);
        }
        .food-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
        }
        .food-card h2{
            color: #8b0000;
            font-size: 20px;
            margin: 12px 0 8px;
        }
        .food-card p{
            color: #444444;
            font-size: 17px;
            margin: 5px;
            font-weight: bold;
        }
        a{
            display: inline-block;
            background-color: #529e56;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 35px;
        }
        a:hover {
            background-color: #1f4024
        }
        @media (max-width: 1000px){
            .menu-container {
                grid-template-columns: repeat(3,1fr);
        }
        @media(max-width: 600px) {
            .menu-container {
                grid-template-columns: repeat(2,1fr);
            }
         }    
        }
        </style>
        </head>
    <body>
        <h1>🍟CHATS</h1>
        <div class="menu-container">
        <div class="food-card">
            <img src="image/bhel puri.jpeg" alt="Bhel puri">
            <h2>Bhel puri</h2>
            <p>price: ₹40</p>
        </div>
        <div class="food-card">
            <img src="image/masala puri.jpeg" alt="Masala puri">
            <h2>Masala puri</h2>
            <p>price: ₹40</p>
        </div> 
        <div class="food-card">
            <img src="image/curd puri.jpeg" alt="Dhai puri">
            <h2>Dhai puri</h2>
            <p>Price: ₹40</p>
        </div>
        <div class="food-card">
            <img src="image/pani puri.jpeg" alt="Pani puri">
            <h2>Pani puri</h2>
            <p>Price:₹40</p>
        </div>
        <div class="food-card">
            <img src="image/nepat masala.jpeg" alt="Nepat masala">
            <h2>Nepat masala</h2>
            <p>Price:₹40</p>
        </div>
        <div class="food-card">
            <img src="image/gobi.jpeg" alt="Gobi">
            <h2>Gobi</h2>
            <p>Price:₹80</p>
        </div>
        </div>
        <a href="menu.html">🏡Back to Menu</a>
    </body>
</html>
